name: Desktop build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Linux window dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 pkg-config
    - run: pip install -r desktop/requirements-desktop.txt
    - run: pyinstaller desktop/biketools.spec --noconfirm
    - uses: actions/upload-artifact@v4
      with:
        name: BikeToolsAnalyzer-${{ runner.os }}
        path: dist/BikeToolsAnalyzer
