name: Desktop build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r desktop/requirements-desktop.txt
    - run: pyinstaller desktop/biketools.spec --noconfirm
    - uses: actions/upload-artifact@v4
      with:
        name: BikeToolsAnalyzer-${{ runner.os }}
        path: dist/BikeToolsAnalyzer
    - name: Smoke test (server starts and answers)
      shell: bash
      run: |
        export BIKETOOLS_DATA="$RUNNER_TEMP/btdata"
        EXE=dist/BikeToolsAnalyzer/BikeToolsAnalyzer
        [ -f "$EXE.exe" ] && EXE="$EXE.exe"
        "$EXE" --server 8765 > "$RUNNER_TEMP/server-out.txt" 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/_stcore/health && exit 0; sleep 2; done
        cat "$BIKETOOLS_DATA/launcher.log" || true
        exit 1
    - name: Keep the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ runner.os }}
        path: |
          ${{ runner.temp }}/btdata/launcher.log
          ${{ runner.temp }}/server-out.txt
        if-no-files-found: warn
