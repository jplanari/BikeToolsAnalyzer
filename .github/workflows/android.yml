name: Android APK

# Builds the phone app. A tag like mobile-v1.0.0 publishes the APK on the GitHub Releases page;
# a pull request that touches the phone app only checks that it builds (the APK is kept as a workflow artifact).
on:
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", "src/api/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: pip install pillow

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then v="${GITHUB_REF#refs/tags/mobile-v}"; else v="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - name: Create the Android project
        working-directory: mobile/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/biketools.keystore"
            echo "path=$RUNNER_TEMP/biketools.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK. It installs fine, but a later build signed differently cannot update it (uninstall first)."
          fi

      - name: Patch the project (link, version, icon, signing)
        working-directory: mobile/android
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python patch.py

      - name: Build
        working-directory: mobile/android/android
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi

      - name: Collect the APK
        run: |
          mkdir -p dist
          f=$(find mobile/android/android/app/build/outputs/apk -name '*.apk' | head -n1)
          suffix=""; [ -z "${{ steps.ks.outputs.path }}" ] && suffix="-debug"
          cp "$f" "dist/BikeTools-${{ steps.v.outputs.name }}${suffix}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: BikeTools-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "BikeTools for Android ${{ steps.v.outputs.name }}" \
            --notes "Download the APK on your phone and open it (allow installs from your browser when asked). The app needs the BikeTools phone server running on your computer: see mobile/README.md."
